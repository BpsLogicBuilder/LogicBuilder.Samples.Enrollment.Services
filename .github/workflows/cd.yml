name: CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PROJECT_NAME: "LogicBuilder.Samples.Enrollment.Services"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/bpsLogicBuilder/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Install SonarQube Cloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: "${{ format('BpsLogicBuilder_{0}', env.PROJECT_NAME) }}"
          SONAR_ORGANIZATION_KEY: "bpslogicbuilder"
        run: |
          dotnet-sonarscanner begin /k:"${{ env.SONAR_PROJECT_KEY }}" /o:"${{ env.SONAR_ORGANIZATION_KEY }}" /d:sonar.qualitygate.wait=true /d:sonar.token="${{ env.SONAR_TOKEN }}" /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/coverage.xml" /d:sonar.coverage.exclusions="**/Enrollment.Api/**"

      - name: Run unit tests
        run: |
          dotnet test Enrollment.Bsl.Flow.Tests/Enrollment.Bsl.Flow.Tests.csproj \
          --verbosity normal --configuration Release \
          --results-directory ./TestResults/ \
          -- \
          --coverage \
          --coverage-settings CodeCoverage.runsettings \
          --coverage-output-format xml \
          --coverage-output coverage.xml

      - name: End SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

  deploy-api-service:
    name: Deploy API Service
    runs-on: ubuntu-latest
    if: github.repository_owner == 'BpsLogicBuilder'
    permissions:
      id-token: write
      contents: read
    needs: test
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
      with:
        client-id: ${{ secrets.ARM_DEPLOYER_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Get Deployment Outputs
      id: get_deployment_outputs
      env:
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_ENROLLMENT }}
      run: |
          ACR_NAME=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.acrName.value -o tsv)
          echo "::add-mask::$ACR_NAME"

          ENROLLMENT_KEY_VAULT_NAME=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.keyVaultName.value -o tsv)
          echo "::add-mask::$ENROLLMENT_KEY_VAULT_NAME"

          ENROLLMENT_BSL_CERTIFICATE_NAME=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.enrollBslCertificateName.value -o tsv)
          echo "::add-mask::$ENROLLMENT_BSL_CERTIFICATE_NAME"

          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "enrollment_key_vault_name=$ENROLLMENT_KEY_VAULT_NAME" >> $GITHUB_OUTPUT
          echo "enrollment_bsl_certificate_name=$ENROLLMENT_BSL_CERTIFICATE_NAME" >> $GITHUB_OUTPUT

    - name: Build and Upload Enrollment.Api Image
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        IMAGE_NAME: "enrollmentapi"
        ACR_NAME: ${{ steps.get_deployment_outputs.outputs.acr_name }}
      run: |
        echo "ACR NAME ${{ env.ACR_NAME}}"
        az acr build --registry ${{ env.ACR_NAME }} --image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --image ${{ env.IMAGE_NAME }}:latest --file ./Enrollment.Api/Dockerfile .

    - name: Update Enrollment.Api Container App image source
      uses: azure/arm-deploy@65ae74fb7aec7c680c88ef456811f353adae4d06
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_ENROLLMENT }}
        ENROLLMENT_BSL_CERTIFICATE_NAME: ${{ steps.get_deployment_outputs.outputs.enrollment_bsl_certificate_name }}
        ENROLLMENT_KEY_VAULT_NAME: ${{ steps.get_deployment_outputs.outputs.enrollment_key_vault_name }}
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ env.RESOURCE_GROUP}}
        parameters: imageTag=${{ env.IMAGE_TAG }} keyVaultUrl="https://${{ env.ENROLLMENT_KEY_VAULT_NAME}}.vault.azure.net/" bslCertificateName="${{ env.ENROLLMENT_BSL_CERTIFICATE_NAME }}"
        template: ./infrastructure/enrollmentapi.bicep
        failOnStdErr: false

  deploy-bsl-service:
    name: Deploy BSL Service
    runs-on: ubuntu-latest
    if: github.repository_owner == 'BpsLogicBuilder'
    permissions:
      id-token: write
      contents: read
    needs: test
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
      with:
        client-id: ${{ secrets.ARM_DEPLOYER_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Get Deployment Outputs
      id: get_deployment_outputs
      env:
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_ENROLLMENT }}
      run: |
          ACR_NAME=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.acrName.value -o tsv)
          echo "::add-mask::$ACR_NAME"

          EXPECTED_CERTIFICATE_THUMBPRINT=$(az deployment group show --resource-group ${{ env.RESOURCE_GROUP }} --name main --query properties.outputs.enrollBslCertificateThumbprint.value -o tsv)
          echo "::add-mask::$EXPECTED_CERTIFICATE_THUMBPRINT"

          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "expected_certificate_thumbprint=$EXPECTED_CERTIFICATE_THUMBPRINT" >> $GITHUB_OUTPUT

    - name: Build and Upload Enrollment.Bsl Image
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        IMAGE_NAME: "enrollmentbsl"
        ACR_NAME: ${{ steps.get_deployment_outputs.outputs.acr_name }}
      run: |
        echo "ACR NAME ${{ env.ACR_NAME }}"
        az acr build --registry ${{ env.ACR_NAME }} --image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --image ${{ env.IMAGE_NAME }}:latest --file ./Enrollment.Bsl/Dockerfile .

    - name: Update Enrollment.Bsl Container App image source
      uses: azure/arm-deploy@65ae74fb7aec7c680c88ef456811f353adae4d06
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_ENROLLMENT }}
        CONNECTION_STRING: ${{ secrets.ENROLLMENT_DB_CONNECTION_STRING }}
        EXPECTED_CERTIFICATE_THUMBPRINT: ${{ steps.get_deployment_outputs.outputs.expected_certificate_thumbprint }}
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ env.RESOURCE_GROUP}}
        parameters: imageTag=${{ env.IMAGE_TAG }} dbConnectionString="${{ env.CONNECTION_STRING }}" expectedCerificateThumbprint="${{ env.EXPECTED_CERTIFICATE_THUMBPRINT }}"
        template: ./infrastructure/enrollmentbsl.bicep
        failOnStdErr: false